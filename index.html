<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ARASAKA CORP - CYBERDECK</title>
    <!-- SDK Ufficiale Telegram WebApp -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

        :root {
            --red-main: #ff003c;
            --red-dark: #660018;
            --bg-black: #050203;
            --green-hack: #00ff66;
            --panel-bg: rgba(20, 5, 8, 0.95);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: 'Share Tech Mono', monospace;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            background-color: var(--bg-black);
            color: var(--red-main);
            overflow: hidden;
            position: fixed;
        }

        /* Effetto Linee CRT Cyberpunk */
        body::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.4) 50%);
            background-size: 100% 4px;
            z-index: 100;
            pointer-events: none;
        }

        /* --- SCHERMATA INTRO TERMINALE HACKING --- */
        #intro-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            z-index: 999;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            box-sizing: border-box;
            font-size: 0.85rem;
            color: var(--red-main);
        }

        .terminal-log {
            line-height: 1.5;
            word-break: break-all;
            margin-bottom: 20px;
        }

        .log-green { color: var(--green-hack); }
        .log-red { color: var(--red-main); font-weight: bold; }

        .progress-border {
            border: 1px solid var(--red-main);
            padding: 10px;
            text-align: center;
            background: rgba(255, 0, 60, 0.1);
        }

        /* --- MENU PRINCIPALE ARASAKA --- */
        #main-hud {
            display: none; /* Nascosto durante l'intro */
            height: 100vh;
            padding: 40px 15px 20px 15px;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
        }

        .header {
            border: 2px solid var(--red-main);
            padding: 12px;
            background: var(--panel-bg);
            box-shadow: 0 0 15px rgba(255, 0, 60, 0.5);
        }

        .header-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.4rem;
            letter-spacing: 2px;
            font-weight: bold;
            border-bottom: 1px solid var(--red-dark);
            padding-bottom: 6px;
            margin-bottom: 8px;
        }

        .kanji { font-size: 1.2rem; letter-spacing: 4px; }

        .status-bar {
            font-size: 0.75rem;
            display: flex;
            justify-content: space-between;
            opacity: 0.9;
        }

        .status-box {
            margin: 15px 0;
            border: 1px solid var(--red-main);
            padding: 10px;
            background: rgba(40, 0, 10, 0.5);
            font-size: 0.85rem;
            line-height: 1.5;
        }

        .status-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
        }

        .status-item span:last-child {
            color: #fff;
            background: var(--red-dark);
            padding: 0 5px;
        }

        .menu-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .arasaka-btn {
            background: var(--panel-bg);
            border: 1px solid var(--red-main);
            color: var(--red-main);
            padding: 15px 18px;
            font-size: 1.1rem;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .arasaka-btn:active {
            background: var(--red-main);
            color: #000;
            box-shadow: 0 0 20px var(--red-main);
            transform: scale(0.98);
        }

        .footer {
            text-align: center;
            border-top: 1px dashed var(--red-main);
            padding-top: 10px;
            font-size: 0.7rem;
            opacity: 0.8;
        }

        .barcode {
            letter-spacing: 6px;
            font-size: 1.1rem;
            font-weight: bold;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <!-- INTERFACCIA INTRO (TERMINALE) -->
    <div id="intro-screen">
        <div class="terminal-log" id="log-content">
            > INITIALIZING CYBERDECK LINK...<br>
        </div>
        <div class="progress-border">
            <span class="log-red">SYSTEM REBOOTING // ARASAKA OS</span>
        </div>
    </div>

    <!-- MENU PRINCIPALE ARASAKA -->
    <div id="main-hud">
        <div class="header">
            <div class="header-title">
                <span>ARASAKA</span>
                <span class="kanji">荒坂社</span>
            </div>
            <div class="status-bar">
                <span>SYS: BATTLEDECK V.02</span>
                <span>SEC: LEVEL 5</span>
            </div>
        </div>

        <div class="status-box">
            <div class="status-item">
                <span>NETRUNNER:</span>
                <span id="telegram-user">UNKNOWN</span>
            </div>
            <div class="status-item">
                <span>NET STATUS:</span>
                <span>BREACHED</span>
            </div>
            <div class="status-item">
                <span>TARGET NODE:</span>
                <span>127.0.0.1</span>
            </div>
        </div>

        <div class="menu-grid">
            <button class="arasaka-btn" onclick="triggerAction('HACK')">
                <span>[ BREACH NETWORK ]</span>
                <span>▶ 01</span>
            </button>
            <button class="arasaka-btn" onclick="triggerAction('DATA')">
                <span>[ ARASAKA DATABASE ]</span>
                <span>▶ 02</span>
            </button>
            <button class="arasaka-btn" onclick="triggerAction('SCAN')">
                <span>[ CYBERWARE SCAN ]</span>
                <span>▶ 03</span>
            </button>
            <button class="arasaka-btn" onclick="triggerAction('CLOSE')">
                <span>[ DISCONNECT ]</span>
                <span>✖ ESC</span>
            </button>
        </div>

        <div class="footer">
            <div>CONFIDENTIAL - ARASAKA SECURITY DIVISION</div>
            <div class="barcode">||| | ||||| || | |||| |||</div>
        </div>
    </div>

    <script>
        // Inizializzazione Telegram WebApp
        const tg = window.Telegram.WebApp;

        // Forzatura Schermo Intero per iPhone
        tg.expand();
        if (tg.requestFullscreen) {
            tg.requestFullscreen();
        }
        if (tg.disableVerticalSwipes) {
            tg.disableVerticalSwipes(); // Impedisce la chiusura accidentale trascinando verso il basso
        }

        // Recupera il nome dell'utente Telegram
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            document.getElementById('telegram-user').innerText = tg.initDataUnsafe.user.first_name.toUpperCase();
        }

        // Animazione del Terminale di Intro
        const logContent = document.getElementById('log-content');
        const logs = [
            "<span class='log-green'>> CONNECTING TO NEURAL PORT... OK</span>",
            "> BYPASSING ICE FIREWALL...",
            "> ACCESSING ARASAKA MAIN FRAMEWORK...",
            "<span class='log-red'>> SECURITY OVERRIDE SUCCESSFUL!</span>",
            "> LOADING CYBERDECK HUD..."
        ];

        let index = 0;
        const interval = setInterval(() => {
            if (index < logs.length) {
                logContent.innerHTML += logs[index] + "<br>";
                index++;
            } else {
                clearInterval(interval);
                setTimeout(() => {
                    // Nasconde la schermata d'intro e mostra il menu
                    document.getElementById('intro-screen').style.display = 'none';
                    document.getElementById('main-hud').style.display = 'flex';
                    if (tg.HapticFeedback) {
                        tg.HapticFeedback.notificationOccurred('success'); // Vibrazione di successo
                    }
                }, 600);
            }
        }, 450);

        // Funzione Pulsanti
        function triggerAction(actionName) {
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('medium');
            }

            if (actionName === 'CLOSE') {
                tg.close();
            } else {
                tg.sendData(JSON.stringify({ action: actionName }));
            }
        }
    </script>
</body>
</html>
